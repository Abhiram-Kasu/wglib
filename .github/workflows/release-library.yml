name: Build and Publish Library

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: static-library-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-14 \
            g++-14 \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libx11-dev \
            libx11-xcb-dev \
            libgl1-mesa-dev

      - name: Configure
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            cmake -S . -B build -G Ninja \
              -DCMAKE_C_COMPILER=gcc-14 \
              -DCMAKE_CXX_COMPILER=g++-14 \
              -DCMAKE_CXX_STANDARD=23 \
              -DCMAKE_BUILD_TYPE=Release \
              -DWGLIB_LIBRARY_TYPE=STATIC \
              -DWGLIB_BUILD_EXAMPLES=OFF \
              -DWGLIB_BUILD_TESTS=ON \
              -DCMAKE_INSTALL_PREFIX=install
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            cmake -S . -B build -G Ninja \
              -DCMAKE_CXX_STANDARD=23 \
              -DCMAKE_BUILD_TYPE=Release \
              -DWGLIB_LIBRARY_TYPE=STATIC \
              -DWGLIB_BUILD_EXAMPLES=OFF \
              -DWGLIB_BUILD_TESTS=ON \
              -DWGLIB_PORTABLE_WINDOWS=ON \
              -DCMAKE_INSTALL_PREFIX=install
          else
            cmake -S . -B build -G Ninja \
              -DCMAKE_CXX_STANDARD=23 \
              -DCMAKE_BUILD_TYPE=Release \
              -DWGLIB_LIBRARY_TYPE=STATIC \
              -DWGLIB_BUILD_EXAMPLES=OFF \
              -DWGLIB_BUILD_TESTS=ON \
              -DCMAKE_INSTALL_PREFIX=install
          fi

      - name: Build
        run: cmake --build build --config Release --target wglib wglib_examples wglib_api_smoke --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install
        run: cmake --install build --config Release

      - name: Package
        run: cpack --config build/CPackConfig.cmake -C Release

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: wglib-static-${{ matrix.os }}
          path: |
            build/packages/*.tar.gz
            build/packages/*.zip

  release:
    name: Create GitHub Release
    needs: package
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Select release name
        id: release_metadata
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "release_tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "release_title=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            nightly_id="${GITHUB_SHA:0:12}"
            echo "release_tag=nightly-${nightly_id}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "release_title=Nightly ${nightly_id}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_metadata.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.release_metadata.outputs.release_title }}
          PRERELEASE: ${{ steps.release_metadata.outputs.prerelease }}
        shell: bash
        run: |
          release_args=("$RELEASE_TAG" packages/* --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}" --repo "$GITHUB_REPOSITORY"

name: Build and Publish Library

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: static-library-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DWGLIB_LIBRARY_TYPE=STATIC
          -DWGLIB_BUILD_EXAMPLES=OFF
          -DWGLIB_BUILD_TESTS=ON
          -DCMAKE_INSTALL_PREFIX=install

      - name: Build
        run: cmake --build build --target wglib wglib_examples wglib_api_smoke --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install
        run: cmake --install build

      - name: Package
        run: cpack --config build/CPackConfig.cmake

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: wglib-static-${{ matrix.os }}
          path: |
            build/packages/*.tar.gz
            build/packages/*.zip

  release:
    name: Create GitHub Release
    needs: package
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Select release name
        id: release_metadata
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "release_tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "release_title=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            nightly_id="${GITHUB_SHA:0:12}"
            echo "release_tag=nightly-${nightly_id}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "release_title=Nightly ${nightly_id}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_metadata.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.release_metadata.outputs.release_title }}
          PRERELEASE: ${{ steps.release_metadata.outputs.prerelease }}
        shell: bash
        run: |
          release_args=("$RELEASE_TAG" packages/* --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"
